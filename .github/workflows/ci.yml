name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Ruff
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: ESLint
        working-directory: frontend
        run: |
          npm ci
          npx eslint .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Pytest
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag + GitHub release
      packages: write
    # Serialize main pushes so two quick merges can't compute the same version
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for next-version.sh

      # On pushes to main, cut a release when the merged commits warrant one
      # (feat -> minor, fix/perf -> patch, ! / BREAKING CHANGE -> major).
      # Gives Renovate & co. real version tags to track instead of :main.
      - name: Determine release version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "tag=$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: turnbeutel:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 turnbeutel:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container did not become healthy within 60s"
          docker logs smoke
          exit 1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # PRs only build (to catch Dockerfile breakage); pushes to main
      # and version tags also publish to ghcr.io
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Created only after the image is pushed, so every release has an image.
      # Tags made with GITHUB_TOKEN don't retrigger this workflow (no double build).
      - name: Create GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes
